# ============================================================================
# tmux.conf — the {muxer} key policy. THIS FILE IS LIVE: edit it directly.
# ============================================================================
#
#   Instances launched with {muxer} run inside a tmux session. The launcher
#   generates the session itself (panes, status bar, scroll-back typing) and
#   then sources THIS file last — so the active lines below ARE the session's
#   key policy, and anything you change or add here wins over the generated
#   defaults. No Python involved: edit, relaunch, done.
#
#   - Applies on the next launch. To apply to a session already running, from
#     the container's shell pane:
#         tmux -L muxer source-file ~/.claude/tmux.conf
#   - The session lives on its own socket, so every manual command needs the
#     `-L muxer` part; a plain `tmux` talks to an empty scratch server.
#   - `^b` below = Ctrl-b, the tmux prefix. Full reference: `man tmux`, or
#     `^b shift-K` inside the session for the complete key list.
#
#   What stays in the launcher (launch/cluster/tmux.py), deliberately:
#   session construction, the status-bar CONTENT (instance label, the corner
#   hints — which name the quit/help keys bound HERE), the split ratio and its
#   re-assert hooks, scrolled-back type-through (95 generated bindings pinned
#   to `mode-keys emacs` — switching to vi keys here would silently disable
#   it), and clipboard plumbing. Cosmetic OVERRIDES of those still work from
#   this file, since it is sourced last.
#
# ============================================================================


# ----------------------------------------------------------------------------
# Mouse ownership
# ----------------------------------------------------------------------------
# tmux owns the mouse: wheel scrolls history, click focuses a pane, drag marks
# text. Set `off` (or press ^b m, bound below) to give the mouse to YOUR
# terminal instead — native select-and-copy, exactly as without {muxer}.
set -g mouse on

# ----------------------------------------------------------------------------
# What a mouse-drag does on release              (only meaningful with mouse on)
# ----------------------------------------------------------------------------
# tmux's stock behavior: copy the marked text and return to the live prompt.
# The copy lands in tmux's buffer (^b ] pastes it) and is offered to your
# terminal's clipboard — which the terminal may refuse (GNOME Terminal has no
# OSC 52 support); shift+drag selects via the terminal itself and its own
# ctrl+shift+c always works.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \; display-message "copied to tmux (^b ] pastes) - for the system clipboard use shift+drag"
#
# Tried and REVERTED (2026-08-18) — keep the marking visible after release:
#   bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear \; display-message "copied"
# It leaves the pane sitting in copy-mode: the wheel then EXTENDS the marked
# region as if the button were still held, and typing fights the stuck mode.
# The vanishing highlight is the price of a clean return to the prompt.

# ----------------------------------------------------------------------------
# The keys                                            (^b first, then the key)
# ----------------------------------------------------------------------------
# Hand the mouse to your terminal / take it back. Valueless `set -g mouse`
# toggles; the message reports which side owns it now. (Knowingly overrides
# tmux's `select-pane -m` pane-marker — worth less here than this.)
bind-key -N "Mouse: tmux, or your terminal for native select and copy" m set-option -g mouse \; display-message "mouse: #{?mouse,tmux - wheel scrolls and drag copies,your terminal - native select and copy}"

# Quit: end the session, every pane in it, and so the container. Confirms
# first — Enter or y accepts (Y/n), anything else cancels (`-y` is what makes
# Enter accept). A DIRECT chord, no ^b prefix: M-q is tmux for alt+q. THE way
# out — windows linger when their process dies (remain-on-exit, launcher-side),
# so a session never ends by itself. The `-N` note is what lists a binding in
# tmux's own key list (^b shift-K).
# Operator's pick (2026-08-29). alt+q rather than alt+o because a root-table
# chord is consumed before any pane sees it, and Claude Code owns alt+o
# (fast-mode toggle); its only alt defaults are alt+p/o/t, so alt+q is clear.
bind-key -N "Kill this whole session and everything in it" -n M-q confirm-before -y -p "kill this whole session, all windows? (Y/n)" kill-session

# alt+q reaches tmux as ESC-then-q; arrival time is how tmux tells the chord
# from two keystrokes. 50ms (down from tmux's 500) makes humanly-typed ESC, q
# two keys — never a surprise quit prompt — and hands a bare Escape to the
# pane 10x sooner (it is Claude Code's interrupt key).
set -s escape-time 50

# Help: the curated key list (a plain text file — edit it freely; it is
# mounted from settings/muxer-help.txt). Raise -h if you add lines.
bind-key -N "Show the keys that matter here" '?' display-popup -E -w 76 -h 30 "cat ~/.claude/muxer-help.txt; read _"

# tmux's own complete list, one key further. A popup, not bare `list-keys`:
# that opens a disorienting window named [tmux].
bind-key -N "tmux's own full key list" K display-popup -E -w 90 -h 30 "tmux -L muxer list-keys -N; read _"

# Layout: re-stack the shell below the agent (the default shape), or put it
# beside. Chained with \; — a conf-file line ends at an unescaped newline, and
# an unescaped ; would end the BINDING early (the resize would run once, now).
# Percentages match the launcher's defaults (SHELL_PANE_PERCENT / SIDE_...).
bind-key -N "Stack the shell below the agent" - select-layout even-vertical \; resize-pane -t .1 -y 22%
bind-key -N "Put the shell beside the agent" '|' select-layout even-horizontal \; resize-pane -t .1 -x 33%

# ----------------------------------------------------------------------------
# More to tinker with                                     (commented examples)
# ----------------------------------------------------------------------------
# Scroll-back depth per pane (tmux default 2000; affects NEW panes only):
# set -g history-limit 50000
#
# Status bar cosmetics (content is launcher-generated; looks are yours):
# set -g status-style "bg=colour236,fg=colour252"
# set -g status-interval 15
# set -g status off
#
# Your own keys — `bind <key> <command>`:
# bind-key T new-window -c /workspace "htop"        # ^b T: htop in a window
# bind-key S split-window -v                        # ^b S: another shell below
#
# Reclaim a copy-mode letter from type-through (q exits the view again, at the
# cost of no longer typing a literal q while scrolled back):
# bind-key -T copy-mode q send-keys -X cancel
