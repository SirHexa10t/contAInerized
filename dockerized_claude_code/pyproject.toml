# Single source of truth for the launcher's Python dependency list —
# install_dependencies.sh installs from this table (`uv pip install -r
# pyproject.toml`); README's manual-install lines mirror it. The project
# isn't published or pip-installed as a package — run.py runs from the repo —
# so no [build-system] table is needed.
[project]
name = "claude-code-agents"
version = "1.0.0"
description = "Launcher for pre-made Claude Code agents — Dockerized personas, each with its own model, memory, and toolchain."
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
    "rich>=13",
]

[tool.ruff]
# Generous line length — the project intentionally allows long lines for
# multi-name imports, descriptive picker fragments, etc. /test-project no
# longer runs `ruff format --check` (the project's columnar alignment
# conflicts with ruff format's always-on normalization), but this setting
# still kicks in for anyone invoking `ruff format` manually so they get
# less-destructive behaviour than the stock 88-col default.
line-length = 200

[tool.ruff.format]
# Don't treat trailing commas as "must stay multi-line" — lets `ruff format`
# (when run manually) collapse multi-name imports onto one line. Same
# rationale as line-length above.
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Pin the rule set to pyflakes + the pycodestyle error groups — the contract
# this codebase has always been kept clean against. Without an explicit
# `select`, ruff falls back to its built-in default, which broadened across
# versions (0.16 pulls in isort `I`, bugbear `B`, comprehensions `C4`) and
# started flagging deliberate choices here — hand-grouped-by-layer imports
# (not isort order), frozen-dataclass arg defaults, `dict(...)` in tests. Those
# aren't bugs and aren't the style we enforce, so we name the contract rather
# than inherit a moving default. Add a group here to adopt more, deliberately.
select = ["E4", "E7", "E9", "F"]
# E731 (no-lambda-assignments): paths.py uses lambdas as a documented idiom
# for the per-call path builders — compact, aligned, single source of truth
# for every dynamic path. See the "Path builders" docstring in paths.py.
ignore = ["E731"]

[tool.mypy]
# Every def in source modules must carry full annotations — the annotation
# sweep landed, so this locks it in for new code.
disallow_untyped_defs = true

# Tests are exempt from the annotation requirement: annotating hundreds of
# `def test_*(self)` bodies adds noise without safety — mypy still checks
# their bodies against the annotated source API.
[[tool.mypy.overrides]]
module = "launch.tests.*"
disallow_untyped_defs = false

# Third-party deps without bundled type stubs — ignore at the import boundary
# so mypy only flags issues in our own code.
[[tool.mypy.overrides]]
module = ["prompt_toolkit.*", "rich.*", "dotenv"]
ignore_missing_imports = true
