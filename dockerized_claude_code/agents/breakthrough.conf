# Agent configuration — all key=value pairs are exported as env vars
# breakthrough: more resourced than thinker — for agents that need long reasoning chains,
# large file reads, and specialized tool discovery (algorithm invention, NP-hard problem
# attack, novel-approach problem-solving where the path is not predetermined).
ANTHROPIC_MODEL="claude-opus-4-8"
CLAUDE_CODE_EFFORT_LEVEL=max
CLAUDE_CODE_ENABLE_THINKING=1

MAX_THINKING_TOKENS=64000                       # large fixed ceiling (used when adaptive thinking is off)
CLAUDE_CODE_MAX_OUTPUT_TOKENS=40000             # room for long derivations and worked examples
CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS=100000  # full reads of large source / data / paper files

ENABLE_TOOL_SEARCH=true                         # surface specialized tools (CAS, solvers, libraries) when relevant
MAX_MCP_OUTPUT_TOKENS=60000                     # don't truncate verbose tool / library output
