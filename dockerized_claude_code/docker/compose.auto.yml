# Compose layer for the {auto} chain step. Swaps in docker/Dockerfile.auto
# (which adds iptables, sudo, and a tightly-scoped sudoers entry to its
# PARENT_IMAGE), adds CAP_NET_ADMIN so iptables can apply rules, and overrides
# the entrypoint to run the firewall as the container's first action followed
# by claude itself.
#
# `--dangerously-skip-permissions` is appended to the entrypoint here (rather
# than baked into auto-entrypoint.sh) so all flag composition stays visible in
# config — the wrapper just forwards "$@" and doesn't make claude-flag decisions.
#
# Bind-mounts for the firewall script + entrypoint wrapper are Python-staged
# via paths.DOCKER_AUTO_MOUNTS (iterated by agent_composition._apply_auto and
# appended to `docker compose run` as `-v` flags) — not declared here, so the
# YAML is purely about build args, capabilities, env pass-through, and the
# entrypoint command.
#
# Defaults reflect the standalone case (auto directly on top of base):
#   PARENT_IMAGE = claude-agents:base
#   TARGET_IMAGE = claude-agents:auto
# run.py overrides both when chain has prior steps (e.g. PARENT_IMAGE =
# claude-agents:prog when [prog] {auto}).

services:
  claude-code:
    image: ${TARGET_IMAGE:-claude-agents:auto}
    build:
      dockerfile: docker/Dockerfile.auto
      args:
        PARENT_IMAGE: ${PARENT_IMAGE:-claude-agents:base}
    cap_add:
      - NET_ADMIN
    environment:
      # Pass-through of the launcher's resolved whitelist: pre-resolved
      # `<ip>[:port]` / `<cidr>[:port]` tokens (host-side DNS via launch/network.py),
      # space-separated. init-firewall.sh just iptables -A's each entry — no DNS
      # in the container's firewall hot path. The host-side source whitelist is
      # NOT mounted in; the container only sees the resolved address list.
      - WHITELIST_ADDRESSES
    entrypoint: ["/usr/local/bin/auto-entrypoint.sh", "--dangerously-skip-permissions"]
