# Compose layer for the {web} chain step. Swaps in docker/Dockerfile.web
# (chromium apt deps + playwright CLI) and parameterises PARENT_IMAGE /
# TARGET_IMAGE.
#
# Defaults reflect the standalone case ({web} directly on top of [prog]):
#   PARENT_IMAGE = claude-agents:prog
#   TARGET_IMAGE = claude-agents:prog.web
# run.py overrides both when chain has more steps between prog and web
# (e.g. PARENT_IMAGE = claude-agents:prog.auto.dood when {auto}+{DooD}
# sit between).
#
# No env-var staging needed: playwright's default install path
# (`~/.cache/ms-playwright/`) already falls under [prog]'s `~/.cache`
# bind-mount, so the first `playwright install <browser>` populates the
# host cache and every subsequent [prog][web] instance reuses it.

services:
  claude-code:
    image: ${TARGET_IMAGE:-claude-agents:prog.web}
    build:
      dockerfile: docker/Dockerfile.web
      args:
        PARENT_IMAGE: ${PARENT_IMAGE:-claude-agents:prog}
