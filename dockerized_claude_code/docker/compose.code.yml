# Compose layer for the [code] chain step. Swaps in docker/Dockerfile.code
# (build-essential + Rust + Node), parameterises PARENT_IMAGE/TARGET_IMAGE so
# the chain composer in launch/agent_modifiers_handler.py can place this anywhere
# in the build sequence.
#
# Defaults reflect the standalone case (code directly on top of base):
#   PARENT_IMAGE = claude-agents:base
#   TARGET_IMAGE = claude-agents:code
# run.py overrides both when the chain has more steps before/after.

services:
  claude-code:
    image: ${TARGET_IMAGE:-claude-agents:code}
    build:
      dockerfile: docker/Dockerfile.code
      args:
        PARENT_IMAGE: ${PARENT_IMAGE:-claude-agents:base}
        # Weekly-rotating cache-buster — same value applied to several Dockerfile
        # RUN blocks (Rust / uv / Claude Code) so they re-pull latest versions
        # when the value changes. Default "bootstrap" matches the ARG default.
        SOFTWARE_STACK_REFRESH: ${SOFTWARE_STACK_REFRESH:-bootstrap}
        # Each gates the matching optional CLI install in Dockerfile.code. Set to
        # "1" by run.py when the corresponding user_extras/optional_creds/<name>/ exists
        # on the host (otherwise unset → "0", and the install RUN is a no-op).
        INSTALL_AWS:     ${INSTALL_AWS:-0}
        INSTALL_GCLOUD:  ${INSTALL_GCLOUD:-0}
        INSTALL_GH:      ${INSTALL_GH:-0}
        INSTALL_GLAB:    ${INSTALL_GLAB:-0}
        INSTALL_JIRA:    ${INSTALL_JIRA:-0}
        INSTALL_KUBE:    ${INSTALL_KUBE:-0}
        INSTALL_SSH:     ${INSTALL_SSH:-0}
        INSTALL_VERCEL:  ${INSTALL_VERCEL:-0}
        INSTALL_RAILWAY: ${INSTALL_RAILWAY:-0}
