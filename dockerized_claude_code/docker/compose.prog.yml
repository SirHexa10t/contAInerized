# Compose layer for the [prog] chain step. Swaps in docker/Dockerfile.prog
# (build-essential + Rust + Node), parameterises PARENT_IMAGE/TARGET_IMAGE so
# the chain composer in launch/agent_composition.py can place this anywhere
# in the build sequence.
#
# Defaults reflect the standalone case (prog directly on top of base):
#   PARENT_IMAGE = claude-agents:base
#   TARGET_IMAGE = claude-agents:prog
# run.py overrides both when the chain has more steps before/after.

services:
  claude-code:
    image: ${TARGET_IMAGE:-claude-agents:prog}
    build:
      dockerfile: docker/Dockerfile.prog
      args:
        PARENT_IMAGE: ${PARENT_IMAGE:-claude-agents:base}
        # Each gates the matching optional CLI install in Dockerfile.prog. Set to
        # "1" by run.py when the corresponding optional_creds/<name>/ exists on the
        # host (otherwise unset → "0", and the install RUN is a no-op).
        INSTALL_AWS:     ${INSTALL_AWS:-0}
        INSTALL_GCLOUD:  ${INSTALL_GCLOUD:-0}
        INSTALL_GH:      ${INSTALL_GH:-0}
        INSTALL_GLAB:    ${INSTALL_GLAB:-0}
        INSTALL_KUBE:    ${INSTALL_KUBE:-0}
        INSTALL_VERCEL:  ${INSTALL_VERCEL:-0}
        INSTALL_RAILWAY: ${INSTALL_RAILWAY:-0}
