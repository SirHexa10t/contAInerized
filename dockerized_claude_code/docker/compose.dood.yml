# Compose layer for the {DooD} (Docker-out-of-Docker) chain step. Swaps in
# docker/Dockerfile.dood (Docker CLI + Compose plugin + claude in the docker
# group), parameterises PARENT_IMAGE/TARGET_IMAGE, and threads the host
# docker-group GID through as a build arg.
#
# The /var/run/docker.sock bind-mount is Python-staged via paths.DOCKER_DOOD_MOUNTS
# (iterated by agent_modifiers_handler._apply_dood and appended to `docker compose
# run` as a `-v` flag) — not declared here, so the YAML is purely about
# build wiring.
#
# Defaults reflect the standalone case (DooD directly on top of code):
#   PARENT_IMAGE = claude-agents:code
#   TARGET_IMAGE = claude-agents:code.dood
# run.py overrides both when chain has more steps between code and dood
# (e.g. PARENT_IMAGE = claude-agents:code.auto when {auto} sits between).
#
# DOCKER_GID is detected on the host via docker_config.detect_docker_gid and
# staged by _apply_dood before the build, so the in-image `docker` group's
# GID matches the host's.

services:
  claude-code:
    image: ${TARGET_IMAGE:-claude-agents:code.dood}
    build:
      dockerfile: agents/profession/code/_dood/Dockerfile
      args:
        PARENT_IMAGE: ${PARENT_IMAGE:-claude-agents:code}
        DOCKER_GID: ${DOCKER_GID:-999}
