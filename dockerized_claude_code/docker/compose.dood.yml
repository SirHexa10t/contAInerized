# Compose layer for the {DooD} (Docker-out-of-Docker) chain step. Swaps in
# docker/Dockerfile.dood (Docker CLI + Compose plugin + claude in the docker
# group), bind-mounts /var/run/docker.sock, parameterises PARENT_IMAGE/TARGET_IMAGE.
#
# Defaults reflect the standalone case (DooD directly on top of prog):
#   PARENT_IMAGE = claude-agents:prog
#   TARGET_IMAGE = claude-agents:prog.dood
# run.py overrides both when chain has more steps between prog and dood
# (e.g. PARENT_IMAGE = claude-agents:prog.auto when {auto} sits between).
#
# DOCKER_GID is detected on the host via getent and exported by run.py before
# the build, so the in-image `docker` group's GID matches the host's.

services:
  claude-code:
    image: ${TARGET_IMAGE:-claude-agents:prog.dood}
    build:
      dockerfile: docker/Dockerfile.dood
      args:
        PARENT_IMAGE: ${PARENT_IMAGE:-claude-agents:prog}
        DOCKER_GID: ${DOCKER_GID:-999}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
